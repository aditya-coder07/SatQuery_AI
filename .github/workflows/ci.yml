name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        # The dev extra carries pytest and httpx; httpx is required by
        # fastapi.testclient, so installing pytest alone makes tests/test_api.py
        # fail at import.
        run: pip install -e ".[dev]"

      - name: Run capability matrix validation
        run: satquery matrix --validate

      - name: Run tests
        run: pytest tests/
