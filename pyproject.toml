[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery"
version = "0.1.0"
description = "SatQuery AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "rasterio==1.5.1",
]

[project.scripts]
satquery = "satquery.__main__:main"

[tool.setuptools.packages.find]
include = ["satquery*"]
