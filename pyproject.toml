[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery"
version = "0.1.0"
description = "SatQuery AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    # Geospatial I/O (docs/01)
    "rasterio==1.5.1",
    "numpy==2.4.1",
    # Index engine: GLCM, Otsu, phase correlation, GMM thresholding
    "scikit-image==0.26.0",
    "scipy==1.17.0",
    # Tier-1 intent classifier (TF-IDF + logistic regression, CPU only)
    "scikit-learn==1.8.0",
    # API + SSE. python-multipart is required for multipart form uploads;
    # FastAPI raises at import time on the upload routes without it.
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "python-multipart==0.0.30",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",  # required by fastapi.testclient
]

[project.scripts]
satquery = "satquery.__main__:main"

[tool.setuptools.packages.find]
include = ["satquery*", "evaluation*"]
